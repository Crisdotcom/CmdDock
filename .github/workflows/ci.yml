name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./build.sh
      - name: CLI smoke test
        run: build/CmdDock.app/Contents/MacOS/CmdDock --version
