name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" UNIVERSAL=1 SIGN_IDENTITY=- ./build.sh zip
          echo "SHA256=$(shasum -a 256 "build/CmdDock-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/CmdDock-$VERSION.zip" \
            --title "CmdDock $VERSION" \
            --generate-notes \
            --notes "**SHA-256:** \`$SHA256\`

          Install: \`brew tap crisdotcom/tap && brew trust --cask crisdotcom/tap/cmddock && brew install --cask crisdotcom/tap/cmddock\`"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: scripts/update-cask.sh "$VERSION" "$SHA256"
